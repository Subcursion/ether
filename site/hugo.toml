baseURL = 'https://subcursion.github.io/ether/'
locale = 'en-us'
title = 'Ether'
theme = 'Coder'
defaultcontentlanguage = "en"


[pagination]
pagerSize = 20

[markup.highlight]
style = "github-dark"


[params]
  author = 'subcursion'
  info = 'Full Time Low-Level Linux Developer'
  description = "Building a ray tracer from first principles"
  ShowReadingTime = true
  ShowCodeCopyButtons = true
  ShowToc = true
  enableTwemoji = true
  colorScheme = "auto"
  hidecolorschemetoggle = false
  since = 2026

[[params.social]]
  name = "Github"
  icon = "fa-brands fa-github fa-2x"
  weight = 1
  url = "https://github.com/Subcursion/"

