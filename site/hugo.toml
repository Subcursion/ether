baseURL = 'https://subcursion.github.io/ether/'
locale = 'en-us'
title = 'Ether'
theme = 'terminal'
defaultcontentlanguage = "en"

[pagination]
pagerSize = 20

[markup.highlight]
style = "github-dark"
noClasses = false

[params]
author = 'subcursion'
info = 'Full Time Low-Level Linux Developer'
description = "Building a ray tracer from first principles"

showLanguageSelector = false
fullWidthTheme = true
enableGitInfo = true
showLastUpdated = true
readingTime = true

[[params.social]]
name = "Github"
icon = "fa-brands fa-github fa-2x"
weight = 1
url = "https://github.com/Subcursion/"

[[menu.main]]
name = "Journal"
url = "/posts/"
weight = 10

[[menu.main]]
name = "Technical Notes"
url = "/notes/"
weight = 20

[module]
replacements = "github.com/panr/hugo-theme-terminal/v4 -> themes/terminal"

[languages]
[languages.en]
label = "English"
title = "Terminal"

[languages.en.params]
subtitle = "A simple, retro theme for Hugo"
owner = "Subcursion"
keywords = ""
copyright = ""
menuMore = "Show more"
readMore = "Read more"
readOtherPosts = "Read other posts"
newerPosts = "Newer posts"
olderPosts = "Older posts"
missingContentMessage = "Page not found..."
missingBackButtonLabel = "Back to home page"
minuteReadingTime = "min read"
words = "words"

[languages.en.params.logo]
logoText = "Ether"
logoHomeLink = "/ether/"
